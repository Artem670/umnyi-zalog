<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#022E5B"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';document.head.appendChild(s)"></script></head><body><title>Умный залог</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app shell. Sticky header with burger, slide-out drawer, one page at a time in a 520px column. Soft blue family from the team palette. */
:root{
  --ink:#031725;      /* palette 1 */
  --navy:#022E5B;     /* palette 2 */
  --sky:#499BED;      /* palette 3 */
  --mist:#A1C6F6;     /* palette 4 */
  --ice:#DAEAFF;      /* palette 5 */
  --hover:#DAEAFF; --bg:#F2F7FF; --surface:#FFFFFF; --surface-2:#EAF2FF; --line:#D3E3F8;
  --text:#031725; --muted:#4D6684; --primary:#022E5B; --on-primary:#FFFFFF; --accent:#499BED; --soft:#DAEAFF; --soft-ink:#022E5B;
  --ok:#1E7F5A; --ok-soft:#DDF3E8; --warn:#9A6206; --warn-soft:#FCEFD6; --bad:#B23B3B; --bad-soft:#FBE3E3;
  --shadow:0 1px 2px rgba(2,46,91,.05),0 8px 24px rgba(2,46,91,.07);
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:20px; --r-s:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --hover:#24364D; --bg:#0E1116; --surface:#161B22; --surface-2:#1E242D; --line:#2A323D; --sky:#5AA6F2;
  --text:#E8EEF6; --muted:#93A1B3; --primary:#5AA6F2; --on-primary:#0E1116; --accent:#A1C6F6; --soft:#1B2A3D; --soft-ink:#CFE3FF;
  --ok:#5CCB9C; --ok-soft:#13302A; --warn:#F0BC66; --warn-soft:#33291A; --bad:#F08A8A; --bad-soft:#3A2024;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --hover:#24364D; --bg:#0E1116; --surface:#161B22; --surface-2:#1E242D; --line:#2A323D; --sky:#5AA6F2;
  --text:#E8EEF6; --muted:#93A1B3; --primary:#5AA6F2; --on-primary:#0E1116; --accent:#A1C6F6; --soft:#1B2A3D; --soft-ink:#CFE3FF;
  --ok:#5CCB9C; --ok-soft:#13302A; --warn:#F0BC66; --warn-soft:#33291A; --bad:#F08A8A; --bad-soft:#3A2024;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:18px;line-height:1.3;font-weight:650;text-wrap:balance}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icon-btn{appearance:none;border:0;background:var(--surface-2);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--soft-ink)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:36px;height:36px;border-radius:11px;flex:none;background:linear-gradient(140deg,var(--sky),var(--navy));display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand span{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.role-pill{flex:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--soft);color:var(--soft-ink);border:0;cursor:pointer}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,23,37,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(86vw,330px);background:var(--surface);box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;gap:18px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.drawer.open{transform:none}
.drawer .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.nav button{appearance:none;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left;font-size:15px;font-weight:500}
.nav button[aria-current="page"]{background:var(--soft);color:var(--soft-ink);font-weight:600}
.nav button:hover{background:var(--surface-2)}
.nav .ic{width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--soft-ink)}
.nav button[aria-current="page"] .ic{background:var(--surface)}
.drawer .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* page */
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.soft{background:var(--soft);box-shadow:none;color:var(--soft-ink)}
.card.soft .muted{color:inherit;opacity:.8}
.tabs{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;box-shadow:none;padding:9px 14px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;background:transparent;padding:9px 8px;border-radius:11px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}

.btn{appearance:none;border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);font-weight:600;font-size:15px;padding:13px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec{background:var(--soft);color:var(--soft-ink)}
.btn.ghost{background:transparent;color:var(--soft-ink);padding:10px 12px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .fl{font-size:13px;font-weight:500;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:11px 13px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{resize:vertical;min-height:90px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid2>*{min-width:0}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:46px;line-height:1.3;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator{opacity:.6}
input[type=file]{max-width:100%;min-width:0;font-size:14px}
@media (max-width:520px){input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=month],select,textarea{font-size:16px}}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.kv{display:flex;flex-direction:column;gap:0;margin:0}
.kv div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere;min-width:0}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 8px}
.empty .bubble{width:58px;height:58px;border-radius:18px;background:var(--soft);display:grid;place-items:center;color:var(--soft-ink)}
.empty p{max-width:34ch}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;align-self:flex-start;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--soft);color:var(--soft-ink)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}

.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.room{display:flex;flex-direction:column;gap:6px;min-width:0}
.room .nm{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;font-weight:600}
.room .nm button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;font-size:12px}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:14px;background:var(--surface-2);border:1.5px dashed var(--mist);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;text-align:center;gap:4px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.filled{border-style:solid;border-color:transparent}
label.pick{display:block;cursor:pointer;border-radius:14px;position:relative}
label.pick input{position:absolute;opacity:0;width:1px;height:1px}
label.pick:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.room input[type=text]{padding:8px 10px;font-size:13px}

.list{display:flex;flex-direction:column;gap:10px}
.item{appearance:none;border:0;text-align:left;cursor:pointer;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-s);padding:14px 16px;display:flex;align-items:center;gap:12px;width:100%}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--soft-ink);flex:none}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}

.steps{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;padding-bottom:14px;position:relative;font-size:14px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.steps .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--soft-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps li.done .n{background:var(--ok);color:#fff}
.steps li.now .n{background:var(--primary);color:var(--on-primary)}
.steps small{display:block;color:var(--muted);font-size:12px}

details{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-s);padding:14px 16px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted);font-weight:500}
details[open] summary::after{content:"−"}
details p{margin-top:8px;color:var(--muted);font-size:14px}

.chat{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.msg.sys{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.chat-in{display:flex;gap:8px}
.chat-in input{flex:1}
.chat-in .btn{width:auto;flex:none}

.law{display:flex;gap:12px;align-items:flex-start}
.law .art{flex:none;font-weight:700;font-size:13px;background:var(--soft);color:var(--soft-ink);border-radius:10px;padding:6px 9px;font-variant-numeric:tabular-nums}

.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--sky)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
:root[data-theme="dark"] .toast{background:var(--surface-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--surface-2)}}
.logo.mark{background:none;width:40px;height:40px;border-radius:12px;box-shadow:0 4px 12px rgba(2,46,91,.18)}
.logo.mark svg{display:block}
.brand b em{font-style:normal;color:var(--sky)}
.ic-round{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--soft-ink);display:grid;place-items:center;flex:none}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.tr-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.tr-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mist),var(--sky))}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.bar-row .tr{grid-column:1/-1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-row .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mist),var(--sky))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bell{position:relative}
.bell .dotc{position:absolute;top:3px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--sky);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.brand>div:last-child{min-width:0}
.brand b,.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.role-pill{display:none}}
.stars{display:inline-flex;gap:2px;color:var(--sky);font-size:18px;line-height:1}
.stars .off{color:var(--line)}
.pay{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pay:last-child{border-bottom:0}
.pay .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pay .amt{font-weight:600;font-variant-numeric:tabular-nums}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.ll-band{background:linear-gradient(135deg,#022E5B 0%,#0d4f94 55%,#499BED 100%);color:#fff;border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 14px 34px rgba(2,46,91,.22)}
.ll-band h2{color:#fff;margin:0}
.ll-band .lead2{color:#DAEAFF;font-size:15px;margin:0}
.ll-band .eyebrow{background:rgba(255,255,255,.14);color:#fff;align-self:flex-start}
.ll-perks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ll-perk{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px}
.ll-perk .ic-round{background:rgba(255,255,255,.16);color:#fff;width:34px;height:34px;flex:none}
.ll-perk b{display:block;font-size:14px;color:#fff}
.ll-perk span{font-size:12.5px;color:#DAEAFF;line-height:1.4}
.ll-band .btn{background:#fff;color:#022E5B;align-self:flex-start;width:auto}
@media (max-width:560px){.ll-perks{grid-template-columns:1fr}.ll-band .btn{width:100%}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-room{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmp-room:last-child{border-bottom:0}
.cmp .thumb{border-style:solid}
.cmp .cap{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.uz-badge{border-radius:16px;overflow:hidden;line-height:0;max-width:360px}
.uz-badge svg{width:100%;height:auto;display:block}
.cand{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.cand .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.perk{display:flex;gap:12px;align-items:center}
.contract ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.contract li{font-size:14px;line-height:1.5}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.sign div{border-top:1px solid var(--text);padding-top:6px;font-size:12px;color:var(--muted)}
.notif.go{appearance:none;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:0;transition:background .15s}
.notif.go:hover{background:var(--surface-2)}
.notif.go:active{transform:scale(.995)}
.notif .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

  function teamLogo(h){h=h||18;return '<span class="team-logo" role="img" aria-label="Команда «Нетворкинг»"><img class="tl-l" alt="" src="'+TL_L+'" style="height:'+h+'px"><img class="tl-d" alt="" src="'+TL_D+'" style="height:'+h+'px"></span>'}
  function teamLine(){return '<span class="team-line">'+teamLogo(24)+'</span>'}
  function drawer(){
    return '<div class="head"><div class="brand"><div class="logo mark" aria-hidden="true">'+logoSvg('lgB')+'</div><div><b><em>Умный</em> залог</b><span>Страхование арендатора</span></div></div>'+
      '<button class="icon-btn" data-act="close" aria-label="Закрыть меню">'+ic('x',18)+'</button></div>'+
      (function(){var u=currentUser();if(!u)return '';return '<div class="acc"><div class="ava">'+esc((u.fio||'?').trim().charAt(0).toUpperCase())+'</div><div><b>'+esc(u.fio)+'</b><span class="small muted">'+roleLabel(u.role)+' · '+esc(u.email)+'</span></div></div>'})()+
      '<ul class="nav">'+menuItems().map(function(m){return '<li><button data-page="'+m.id+'"'+(ui.page===m.id||(m.id==='cabinet'&&ui.page==='object')?' aria-current="page"':'')+'><span class="ic">'+ic(m.i,18)+'</span>'+m.t+'</button></li>'}).join('')+'</ul>'+
      '<div class="foot"><button class="btn sec" data-act="theme">Сменить тему</button><button class="btn ghost" data-act="logout">Выйти</button>'+teamLine()+'</div>';
  }

  /* ---------- cabinet: shared profile ---------- */
  function profileTab(){
    var r=store.role,p=prof(),f='prof_'+r;
    if(p&&!ui.edit[f]){
      return '<section class="card"><div class="row" style="align-items:center"><h2 style="flex:1 1 auto">'+esc(p.fio||'Без имени')+'</h2>'+
        '<button class="btn ghost" style="width:auto;flex:none" data-act="edit" data-f="'+f+'">Изменить</button></div>'+
        kv([['Дата рождения',dt(p.birth)],['Паспорт',p.pass?maskPass(p.pass):''],['Кем выдан',esc(p.issued)],['Дата выдачи',dt(p.issuedAt)],['Адрес регистрации',esc(p.reg)],['Телефон',esc(p.phone)],['Почта',esc(p.email)]].concat(r==='landlord'?[['ИНН',esc(p.inn)]]:[]))+
        '</section>';
    }
    var d=p||{};
    return '<section class="card"><h2>'+(p?'Изменить профиль':'Заполните профиль')+'</h2><p class="muted small">Данные нужны, чтобы оформить полис и подтвердить личность при заявке.</p>'+
      '<form data-form="'+f+'">'+
      field(f,'fio','ФИО','text',{value:d.fio,req:1,ph:'Фамилия Имя Отчество'})+
      '<div class="grid2">'+field(f,'birth','Дата рождения','date',{value:d.birth})+field(f,'phone','Телефон','tel',{value:d.phone,ph:'+7'})+'</div>'+
      field(f,'email','Почта','email',{value:d.email})+
      '<span class="lbl">Паспорт</span>'+
      '<div class="grid2">'+field(f,'pass','Серия и номер','text',{value:d.pass,mask:'passport'})+field(f,'issuedAt','Дата выдачи','date',{value:d.issuedAt})+'</div>'+
      field(f,'issued','Кем выдан','text',{value:d.issued})+
      field(f,'reg','Адрес регистрации','text',{value:d.reg})+
      (r==='landlord'?field(f,'inn','ИНН (если есть)','text',{value:d.inn,mask:'inn',ph:'12 цифр'}):'')+
      '<button class="btn" type="submit">Сохранить</button>'+(p?'<button class="btn ghost" type="button" data-act="cancel" data-f="'+f+'">Отмена</button>':'')+
      '</form></section>';
  }

  /* ---------- tenant ---------- */
  // Привязка арендатора к квартире по коду (из формы или из ссылки-приглашения). Возвращает текст ошибки или пустую строку
  var linkResult='linked';
  function myRequest(){var me=store.session;return store.objects.filter(function(o){return !o.tenant&&(o.requests||[]).some(function(r){return r.uid===me})})[0]||null}
  function notify2(uid,text,obj){notifyU(uid,text,obj)}
  function linkToast(){return linkResult==='req'?'Заявка отправлена хозяину на подтверждение':'Квартира привязана'}
  function requestsCard(o){var rq=o.requests||[];if(!rq.length||o.tenant)return '';
    return '<section class="card soft"><h2>Заявка на привязку'+(rq.length>1?' ('+rq.length+')':'')+'</h2><p class="small">Арендатор ввёл код квартиры. Проверьте, что это ваш арендатор, и подтвердите. До подтверждения он не видит данные квартиры.</p><div>'+rq.map(function(r){var rs=reviewsFor(r.name),pa=store.policyApps[r.uid];
      return '<div class="cand"><span class="ic-round" style="width:40px;height:40px">'+ic('user',20)+'</span><span class="tx"><b>'+esc(r.name||'Арендатор')+'</b><span class="small muted">'+esc(r.phone||'')+' · '+esc(r.at)+'</span><span class="chips">'+(pa&&pa.policy?'<span class="badge ok"><i></i>Полис есть</span>':(pa?'<span class="badge info"><i></i>Оформляет полис</span>':''))+(rs.length?'<span class="badge"><i></i>'+avg(rs).toFixed(1)+' ★, '+rs.length+' '+plural(rs.length,'отзыв','отзыва','отзывов')+'</span>':'<span class="badge"><i></i>Нет отзывов</span>')+'</span>'+
        '<span class="row" style="margin-top:6px"><button class="mini ok" data-act="reqOk" data-oid="'+o.id+'" data-uid="'+r.uid+'">Подтвердить</button><button class="mini" data-act="reqNo" data-oid="'+o.id+'" data-uid="'+r.uid+'">Отклонить</button></span></span></div>'}).join('')+'</div></section>'}
  function linkByCode(raw){var code=fmtCode(raw);linkResult='linked';
    var lo=store.objects.filter(function(x){return String(x.code||'').toUpperCase()===code})[0];
    if(!lo)return 'Квартира с кодом '+(code||'')+' не найдена. Проверьте код у хозяина';
    if(lo.tenant&&lo.tenant.uid&&lo.tenant.uid!==store.session)return 'К этой квартире уже привязан другой арендатор';
    var cur=tenantObj();if(cur&&cur.id!==lo.id)return 'У вас уже привязана другая квартира';if(cur)return '';
    var pf=prof()||{},cu=currentUser()||{},ls=lo.lease||{};
    // Хозяин сам пригласил этого арендатора: привязываем сразу. Иначе отправляем заявку хозяину на подтверждение
    if((lo.invites||[]).indexOf(store.session)<0){
      if(myRequest()&&myRequest().id!==lo.id)return 'У вас уже есть заявка на другую квартиру. Отмените её, чтобы отправить новую';

  function priceYear(rent){return Math.round(Math.min(TARIFF.maxYear,Math.max(TARIFF.minYear,rent*TARIFF.rate)))}

  function schedulePersist(){if(!sync.ready)return;clearTimeout(sync.timer);sync.timer=setTimeout(persist,300)}
  function persist(){
    if(sync.mode==='demo')return;

    if(sync.mode!=='sb'||!store.session)return;
    if(sync.busy){sync.again=true;return}
    var changed=allKeys().filter(function(k){return ser(k)!==sync.last[k]});
    if(!changed.length)return;
    sync.busy=true;
    (function next(i){
      if(i>=changed.length){sync.busy=false;if(sync.again){sync.again=false;persist()}return}
      var k=changed[i],s=ser(k),at=new Date().toISOString();sync.last[k]=s;

    })(0);

    if(sync.mode!=='sb'||!store.session||sync.busy||hasLocalChanges())return;
    sync.sb.from('app_state').select('key,updated_at').then(function(r){
      var keys=(r.data||[]).filter(function(x){return isKey(x.key)&&x.updated_at!==sync.ts[x.key]}).map(function(x){return x.key});
      if(!keys.length)return;

    },function(){});
  }

    if(m.indexOf('rate')>=0)return 'Слишком много попыток, подождите минуту';
    if(m.indexOf('fetch')>=0||m.indexOf('network')>=0)return 'Нет связи с сервером. Проверьте интернет или попробуйте с VPN';
    return 'Не получилось: '+(e&&e.message||'ошибка сети')}
  // Вход и регистрация: кнопка показывает «Входим…», любая ошибка видна на экране, зависший запрос обрывается через 20 секунд
  // Перерисовка формы не должна стирать пароль и галочку согласия
  function keepAuth(fn){var ids=['login_pass','register_pass'],vals={},ag=document.getElementById('register_agree'),agv=ag&&ag.checked;ids.forEach(function(i){var el=document.getElementById(i);if(el)vals[i]=[el.value,el.type]});fn();ids.forEach(function(i){var el=document.getElementById(i);if(el&&vals[i]){el.value=vals[i][0];el.type=vals[i][1]}});var ag2=document.getElementById('register_agree');if(ag2&&agv)ag2.checked=true}
  function authStart(){ui.authBusy=true;ui.authStage='auth';ui.authErr='';keepAuth(render);clearTimeout(sync.authTimer);sync.authTimer=setTimeout(function(){if(!ui.authBusy)return;ui.authBusy=false;ui.authErr='Сервер не отвечает. Проверьте интернет и попробуйте ещё раз';keepAuth(render)},20000)}
  function authFail(msg){clearTimeout(sync.authTimer);ui.authBusy=false;ui.authErr=msg;keepAuth(render)}
  function authOk(user,note){clearTimeout(sync.authTimer);ui.authStage='data';keepAuth(render);return afterAuth(user,true).then(function(){ui.authBusy=false;render();toast(note)},function(e){authFail('Вошли, но не удалось загрузить данные: '+(e&&e.message||'ошибка сети'))})}
  function sbRegister(data){var em=String(data.email||'').toLowerCase().trim(),ph=String(data.phone||'').replace(/\D/g,'');
    var err=!data.fio?'Укажите ФИО':(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?'Проверьте почту':(ph.length<11?'Проверьте телефон':(String(data.pass||'').length<6?'Пароль должен быть не короче 6 символов':(!data.agree?'Нужно согласие на обработку данных':(ui.regRole==='admin'&&String(data.adminCode||'').trim().toUpperCase()!==ADMIN_CODE?'Неверный код администратора':'')))));
    if(err){ui.authErr=err;keepAuth(render);return}
    authStart();
    try{sync.sb.auth.signUp({email:em,password:data.pass,options:{data:{fio:data.fio,phone:data.phone,role:ui.regRole||'tenant'}}}).then(function(r){
      if(r.error){authFail(sbAuthError(r.error));return}
      if(!r.data.session){clearTimeout(sync.authTimer);ui.authBusy=false;ui.authMode='login';ui.authErr='Мы отправили письмо на '+em+'. Подтвердите почту и войдите. Если письма нет, в Supabase выключите Confirm email';render();return}
      delete ui.drafts.register;authOk(r.data.user,'Аккаунт создан')},function(e){authFail(sbAuthError(e))})}catch(e){authFail(sbAuthError(e))}
  }
  function sbLogin(data){var em=String(data.email||'').toLowerCase().trim();
    if(!em||!data.pass){ui.authErr='Введите почту и пароль';keepAuth(render);return}
    authStart();
    try{sync.sb.auth.signInWithPassword({email:em,password:data.pass}).then(function(r){
      if(r.error){authFail(sbAuthError(r.error));return}
      delete ui.drafts.login;authOk(r.data.user,'Вы вошли')},function(e){authFail(sbAuthError(e))})}catch(e){authFail(sbAuthError(e))}
  }
  function sbLogout(){if(sync.sb)sync.sb.auth.signOut()}

  window.addEventListener('error',function(e){try{toast('Ошибка на странице: '+(e.message||'неизвестная'))}catch(x){}});
  window.addEventListener('unhandledrejection',function(e){try{var r=e.reason;toast('Ошибка: '+(r&&r.message||r||'неизвестная'))}catch(x){}});
  sync.sessionId=lsGet('uz_session');
  render();
  (function boot(){
    function fallback(){if(sync.mode==='sb'||sync.mode==='demo')return;sync.mode='local';localLoad();restoreSession();sync.ready=true;setNote('Демо-режим: данные сохраняются только в этом браузере.');render()}
    if(!SB_URL||SB_URL.indexOf('__')===0||!SB_KEY){fallback();return}
    var tries=0;(function wait(){if(window.supabase&&typeof window.supabase.createClient==='function')return go();if(++tries>50){fallback();return}setTimeout(wait,200)})();
    function go(){
      if(sync.mode==='demo')return;
      try{sync.sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){fallback();return}
      sync.mode='sb';sync.sessionId=null;
      sync.sb.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;if(s&&s.user)afterAuth(s.user,false);else render()},function(){render()});
    }
  })();
})();
</script>
</body></html>
